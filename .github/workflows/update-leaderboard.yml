name: 🏆 Hourly Leaderboard Update

on:
  schedule:
    # Every hour
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update leaderboard
        id: leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          output=$(python scripts/update_leaderboard.py)
          echo "$output"
          credits=$(echo "$output" | grep "^NEW_CREDITS:" | sed 's/^NEW_CREDITS://')
          echo "new_credits=$credits" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          git config --global user.name "arena-bot[bot]"
          git config --global user.email "arena-bot@users.noreply.github.com"
          git add README.md .arena_state/
          git diff --staged --quiet || git commit -m "chore: hourly leaderboard update [skip ci]"
          git push

      - name: Post Discussion comment for new credits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCUSSION_ID: "D_kwDO..."
        run: |
          credits='${{ steps.leaderboard.outputs.new_credits }}'
          if [ -z "$credits" ]; then
            echo "No new credits, skipping."
            exit 0
          fi
          MENTIONS=$(python3 -c "
          import json
          credits = json.loads('$credits')
          lines = []
          for c in credits:
              lines.append(f\"@{c['author']} earned **{c['pts']} pt(s)** for closing [{c['issue']}](https://github.com/{c['issue'].replace('#', '/issues/')})\")
          print('\n'.join(lines))
          ")
          gh api graphql --field discussionId="$DISCUSSION_ID" --field body="$MENTIONS" -f query='
            mutation($discussionId: ID!, $body: String!) {
              addDiscussionComment(input: {discussionId: $discussionId, body: $body}) {
                comment { id }
              }
            }
          '