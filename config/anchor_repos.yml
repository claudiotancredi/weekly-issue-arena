# Anchor repos — always included in the weekly arena pool.
#
# These 50 repos provide the arena's domain identity (satellite, ML, AI,
# data, Python ecosystem) and a guaranteed baseline. They are always
# included regardless of the dynamic discovery results.
#
# The remaining ~200 slots in the weekly pool are filled dynamically by
# scripts/fetch_repos.py from GitHub Search API queries.
#
# To suggest a new anchor repo: edit this file and open a PR.
# Selection criteria for anchors:
#   - Active maintenance with regular issue throughput
#   - Strong fit for one of the arena's core domains
#   - Welcomes external contributions

