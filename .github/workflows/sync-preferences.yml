name: 🎟️ Arena Consent Sync

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    # Hourly safety net: catches forms whose issue-event run failed or
    # landed while Actions were paused.
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  discussions: write

concurrency:
  group: arena-state-write
  cancel-in-progress: false

jobs:
  sync-preferences:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync consent forms
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            python scripts/sync_preferences.py \
              --issue "${{ github.event.issue.number }}"
          else
            python scripts/sync_preferences.py
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "arena-bot[bot]"
          git config --global user.email "arena-bot@users.noreply.github.com"
          git add .arena_state/
          git diff --staged --quiet || \
            git commit -m "chore: sync arena consent preferences [skip ci]"
          git pull --rebase origin main
          git push
