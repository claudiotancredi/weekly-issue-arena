name: "\U0001F680 Deploy Site"

on:
  workflow_run:
    workflows:
      - "\U0001F504 Weekly Issue Refresh"
      - "\U0001F3C6 Hourly Leaderboard Update"
      # Consent changes must reach the site immediately: the bot's
      # "[skip ci]" commit suppresses the push trigger below, so without
      # this a departing contributor would stay visible until the next
      # hourly run.
      - "\U0001F39F️ Arena Consent Sync"
    types: [completed]
    branches: [main]

  push:
    branches: [main]
    paths:
      - "site/**"
      - ".arena_state/**"
      - "assets/**"
      - "config/anchor_repos.yml"
      - "config/arena_levels.json"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy badge assets into site
        run: cp assets/*.png site/public/badges/

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build Astro site
        working-directory: site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
