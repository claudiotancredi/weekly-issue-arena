# Weekly Issue Arena — issue-fetching configuration
#
# The repo list is no longer stored here. It is built fresh every week by
# scripts/fetch_repos.py and written to .arena_state/repo_pool.json. The
# pool combines:
#   - 50 anchor repos from config/anchor_repos.yml (always included)
#   - ~200 dynamic repos from GitHub Search API queries
#
# This file now only configures the label-to-category mapping. Per-category
# issue limits live in config/arena_levels.json (baseline + arena-level
# bonuses), so collective progress can unlock more issues over time.
#
# To suggest a guaranteed-included repo: edit config/anchor_repos.yml.

# ---------------------------------------------------------------------------
# Label mappings
# ---------------------------------------------------------------------------
label_mappings:
  gfi:
    - "good first issue"
    - "good-first-issue"
    - "beginner"
    - "beginner friendly"
    - "beginner-friendly"
    - "easy"
    - "difficulty: easy"
  bug:
    - "bug"
    - "bug fix"
    - "bugfix"
    - "type: bug"
  hard:
    - "hard"
    - "complex"
    - "advanced"
    - "difficulty: hard"
