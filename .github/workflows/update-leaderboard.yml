name: 🏆 Hourly Leaderboard Update

on:
  schedule:
    # Every hour
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

concurrency:
  group: arena-state-write
  cancel-in-progress: false

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_leaderboard.py

      - name: Commit and push changes
        run: |
          git config --global user.name "arena-bot[bot]"
          git config --global user.email "arena-bot@users.noreply.github.com"
          git add README.md .arena_state/ assets/arena_level.svg
          git diff --staged --quiet || git commit -m "chore: hourly leaderboard update [skip ci]"
          git pull --rebase origin main
          git push
