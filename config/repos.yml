# ---------------------------------------------------------------------------
# Label mappings
# ---------------------------------------------------------------------------
label_mappings:
  gfi:
    - "good first issue"
    - "good-first-issue"
    - "beginner"
    - "beginner friendly"
    - "beginner-friendly"
    - "easy"
    - "difficulty: easy"
  bug:
    - "bug"
    - "bug fix"
    - "bugfix"
    - "type: bug"
  hard:
    - "hard"
    - "complex"
    - "advanced"
    - "difficulty: hard"

# ---------------------------------------------------------------------------
# Weekly issue pool limits per category
# ---------------------------------------------------------------------------
limits:
  gfi: 12
  bug: 8
  hard: 6
