name: 🏆 Hourly Leaderboard Update

on:
  schedule:
    # Every hour
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update leaderboard
        id: leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          output=$(python scripts/update_leaderboard.py)
          echo "$output"
          credits=$(echo "$output" | grep "^NEW_CREDITS:" | sed 's/^NEW_CREDITS://')
          echo "new_credits=$credits" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          git config --global user.name "arena-bot[bot]"
          git config --global user.email "arena-bot@users.noreply.github.com"
          git add README.md .arena_state/
          git diff --staged --quiet || git commit -m "chore: hourly leaderboard update [skip ci]"
          git push

      - name: Post Discussion comment for new credits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCUSSION_ID: "D_kwDONjXVVM4Akt8_"
          NEW_CREDITS: ${{ steps.leaderboard.outputs.new_credits }}
        run: |
          if [ -z "$NEW_CREDITS" ]; then
            echo "No new credits, skipping."
            exit 0
          fi
          python3 -c "
          import json, os
          credits = json.loads(os.environ['NEW_CREDITS'])
          lines = []
          for c in credits:
              issue_url = c['issue'].replace('#', '/issues/')
              lines.append(
                  f\"@{c['author']} earned **{c['pts']} pt(s)** \"
                  f\"for closing [{c['issue']}]\"
                  f\"(https://github.com/{issue_url})\"
              )
          with open('/tmp/mention.txt', 'w') as f:
              f.write('\n'.join(lines))
          "
          gh api graphql \
            --field discussionId="$DISCUSSION_ID" \
            --field "body=@/tmp/mention.txt" \
            -f query='
            mutation($discussionId: ID!, $body: String!) {
              addDiscussionComment(input: {discussionId: $discussionId, body: $body}) {
                comment { id }
              }
            }
          '

      - name: Comment on credited PRs in external repos
        if: steps.leaderboard.outputs.new_credits != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_CREDITS: ${{ steps.leaderboard.outputs.new_credits }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT secret not configured, skipping PR comments."
            exit 0
          fi
          python3 -c "
          import json, os, subprocess
          credits = json.loads(os.environ['NEW_CREDITS'])
          for c in credits:
              pr_url = c.get('pr_url', '')
              if not pr_url:
                  continue
              # Extract owner/repo/number from https://github.com/OWNER/REPO/pull/NUMBER
              parts = pr_url.rstrip('/').split('/')
              owner, repo, number = parts[-4], parts[-3], parts[-1]
              body = (
                  f\":trophy: @{c['author']} just earned **{c['pts']} point(s)** \"
                  f\"in the [Weekly Issue Arena](https://claudiotancredi.github.io/weekly-issue-arena/) \"
                  f\"for closing this issue!\n\n\"
                  f\"[See the leaderboard \\u2192](https://claudiotancredi.github.io/weekly-issue-arena/leaderboard/)\"
              )
              result = subprocess.run(
                  ['gh', 'api', f'repos/{owner}/{repo}/issues/{number}/comments',
                   '-f', f'body={body}'],
                  capture_output=True, text=True
              )
              if result.returncode == 0:
                  print(f'Commented on {owner}/{repo}#{number}')
              else:
                  print(f'Failed to comment on {owner}/{repo}#{number}: {result.stderr}')
          "