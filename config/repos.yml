# Weekly Issue Arena — issue-fetching configuration
#
# The repo list is no longer stored here. It is built fresh every week by
# scripts/fetch_repos.py and written to .arena_state/repo_pool.json. The
# pool combines:
#   - 50 anchor repos from config/anchor_repos.yml (always included)
#   - ~200 dynamic repos from GitHub Search API queries
#
# This file now only configures HOW issues are fetched from each repo:
#   - label_mappings: which issue labels map to each arena category
#   - limits:        how many issues to surface per category each week
#
# To suggest a guaranteed-included repo: edit config/anchor_repos.yml.

# ---------------------------------------------------------------------------
# Label mappings
# ---------------------------------------------------------------------------
label_mappings:
  gfi:
    - "good first issue"
    - "good-first-issue"
    - "beginner"
    - "beginner friendly"
    - "beginner-friendly"
    - "easy"
    - "difficulty: easy"
  bug:
    - "bug"
    - "bug fix"
    - "bugfix"
    - "type: bug"
  hard:
    - "hard"
    - "complex"
    - "advanced"
    - "difficulty: hard"

# ---------------------------------------------------------------------------
# Weekly issue pool limits per category
# ---------------------------------------------------------------------------
limits:
  gfi: 20
  bug: 14
  hard: 10

# ---------------------------------------------------------------------------
# Bucket-aware floor quotas per category
#
# Floors (not exact shares): at least N issues from each listed bucket are
# reserved before the remaining slots are filled randomly from the combined
# pool. Floors that can't be met (because a bucket had fewer eligible
# issues) are silently dropped into the free fill, so no slot is ever left
# empty.
#
# Leaving a category unset, or omitting this whole block, falls back to
# pure weekly-seeded random selection across all buckets.
# ---------------------------------------------------------------------------
bucket_quotas:
  gfi:
    anchor: 8
    trending: 2
  bug:
    anchor: 6
    trending: 2
  hard:
    anchor: 4
    trending: 1
