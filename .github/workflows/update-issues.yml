name: 🔄 Weekly Issue Refresh

on:
  schedule:
    # Every Friday at 17:00 UTC
    - cron: "0 17 * * 5"
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  refresh-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch new issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_issues.py

      - name: Commit and push changes
        run: |
          git config --global user.name "arena-bot[bot]"
          git config --global user.email "arena-bot@users.noreply.github.com"
          git add README.md .arena_state/
          git diff --staged --quiet || git commit -m "chore: weekly issue refresh [skip ci]"
          git push
