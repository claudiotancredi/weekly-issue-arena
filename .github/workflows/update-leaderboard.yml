name: 🏆 Hourly Leaderboard Update

on:
  schedule:
    # Every hour
    - cron: "0 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["🔄 Weekly Issue Refresh"]
    types: [completed]

permissions:
  contents: write
  discussions: write

concurrency:
  group: arena-state-write
  cancel-in-progress: false

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if waiting for issue refresh
        if: github.event_name == 'schedule'
        id: skip-check
        run: |
          day=$(date -u +%u)
          hour=$(date -u +%H)
          if [ "$day" = "5" ] && [ "$hour" -ge 17 ]; then
            week=$(date -u +%G-W%V)
            if python3 -c "import json,sys; d=json.load(open('.arena_state/issues.json')); sys.exit(0 if '$week' in d else 1)" 2>/dev/null; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "Friday 17+, no refresh yet — skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.skip-check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Update leaderboard
        if: steps.skip-check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_leaderboard.py

      - name: Commit and push changes
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          git config --global user.name "arena-bot[bot]"
          git config --global user.email "arena-bot@users.noreply.github.com"
          git add README.md .arena_state/ assets/arena_level.svg
          git diff --staged --quiet || git commit -m "chore: hourly leaderboard update [skip ci]"
          git pull --rebase origin main
          git push
