# Inclusion criteria:
#   - Actively maintained (commits within the last 6 months)
#   - Uses standard GitHub issue labels (good first issue, bug, etc.)
#   - Welcomes external contributions
#
# To suggest a new repo: open a PR editing this file or start a Discussion.

