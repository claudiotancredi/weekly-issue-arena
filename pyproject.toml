[project]
name = "weekly-issue-arena"
version = "1.0.0"
description = "A weekly-refreshed hub of open-source issues with a leaderboard for contributors who close them."
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "D",
    "I",
]

[tool.ruff.lint.pydocstyle]
convention = "google"