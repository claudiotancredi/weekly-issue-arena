name: 🏆 Daily Leaderboard Update

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_leaderboard.py

      - name: Commit and push changes
        run: |
          git config --global user.name "arena-bot[bot]"
          git config --global user.email "arena-bot@users.noreply.github.com"
          git add README.md .arena_state/
          git diff --staged --quiet || git commit -m "chore: daily leaderboard update [skip ci]"
          git push
